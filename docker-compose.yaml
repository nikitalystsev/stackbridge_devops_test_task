services:
  backend-python:
    build:
      context: backend
      dockerfile: Dockerfile
    image: backend-python:0.1.0
    container_name: backend-python
    restart: unless-stopped
    networks:
      - my-net

  nginx:
    image: nginx:1.31.3-alpine-slim
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - my-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-python

networks:
  my-net:
    driver: bridge
    name: my-net