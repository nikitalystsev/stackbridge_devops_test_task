services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    image: backend:0.1.0
    container_name: backend
    restart: unless-stopped
    networks:
      - my-net

  nginx:
    image: nginx:1.31.3-alpine-slim
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - my-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

networks:
  my-net:
    driver: bridge
    name: my-net